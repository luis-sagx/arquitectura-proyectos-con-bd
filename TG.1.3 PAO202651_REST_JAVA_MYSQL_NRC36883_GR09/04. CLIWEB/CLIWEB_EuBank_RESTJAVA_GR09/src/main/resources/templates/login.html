<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - EuBank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'eubank-primary': '#0B1F3A',
                        'eubank-secondary': '#173F66',
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen flex items-center justify-center p-4 font-sans bg-slate-950 bg-cover bg-center"
      style="background-image: url('/images/login-background.webp');">

    <main class="w-full max-w-sm p-4 sm:p-6">
        <header class="mb-8 text-center">
            <p class="mb-2 text-sm font-bold uppercase tracking-[0.28em] text-white">JAVA REST</p>
            <h1 class="text-3xl font-bold text-white">Iniciar sesión</h1>
            <p class="mt-2 text-sm text-white/85">Accede a tu banca EurekaBank</p>
        </header>

        <div th:if="${error != null}" class="mb-6 rounded-lg border border-red-300 bg-red-50 px-4 py-3 text-sm text-red-800" role="alert">
            <strong class="font-semibold">Error: </strong>
            <span th:text="${error}"></span>
        </div>

        <form method="post" th:action="@{/login}" class="space-y-5 text-white">
            <div>
                <label for="usuario" class="mb-2 block text-sm font-medium text-white">Usuario</label>
                <input id="usuario" type="text" name="usuario" autocomplete="username" required
                       class="w-full rounded-lg border border-white/70 bg-slate-950/25 px-4 py-3 text-white outline-none transition placeholder:text-white/60 focus:border-white focus:ring-2 focus:ring-white/30" />
            </div>

            <div>
                <label for="clave" class="mb-2 block text-sm font-medium text-white">Contraseña</label>
                <input id="clave" type="password" name="clave" autocomplete="current-password" required
                       class="w-full rounded-lg border border-white/70 bg-slate-950/25 px-4 py-3 text-white outline-none transition placeholder:text-white/60 focus:border-white focus:ring-2 focus:ring-white/30" />
            </div>

            <button type="submit"
                    class="w-full rounded-lg bg-white px-4 py-3 font-semibold text-eubank-primary transition hover:bg-slate-100 focus:outline-none focus:ring-4 focus:ring-white/40">
                Iniciar Sesión
            </button>
        </form>
    </main>

</body>
</html>
